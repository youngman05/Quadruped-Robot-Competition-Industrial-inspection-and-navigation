# YOLO 数据集配置模板
# 使用说明：
#   1. 将图片放入 datasets/images/，标签放入 datasets/labels/
#   2. 修改下方 path、names 等字段
#   3. 运行训练: python scripts/train.py --data configs/dataset.yaml

# 数据集根目录（相对或绝对路径）
path: ../datasets

# 训练集、验证集、测试集
train: images/train
val: images/val
test: images/test  # 可选

# 类别数量
nc: 1

# 类别名称（与标注时的 class_id 对应）
names:
  0: object
