arm_motion_node:
  ros__parameters:
    grasp_actions_topic: /arm/grasp_actions
    place_actions_topic: /arm/place_actions
    posture_actions_topic: /arm/posture_actions
    status_topic: /arm/status
    # The production node exposes services only.  It never subscribes to YOLO.
    tf_lookup_timeout_s: 1.0
    tf_parent_frame: base_link
    tf_child_frame: arm_base_link
    require_tf_in_preflight: true

    # Accepted mounted-arm calibration. Motion remains separately disabled by
    # default and must be enabled only for a supervised hardware run.
    transform_calibrated: true
    enable_motion: true
    port: /dev/ttyACM0
    baud: 115200
    pause_s: 0.2
    scan_first: true

    # Transitional runtime copy. The system-level source of truth is
    # configs/calibration/competition_sites.yaml. Keep motion disabled if the
    # two files disagree; remove this copy when the sites loader is integrated.
    # I1 reference uses arm_base_link axes: +X forward, +Y left, +Z up.
    grasp_reference_configured: true
    # Current hardware-test baseline at z=0.15 m. ArmPi API [0.00, 0.42, z]
    # corresponds to ROS arm_base_link [0.42, 0.00, z].
    grasp_reference_arm_base: [0.42, 0.00]
    grasp_reference_xy_tolerance_m: 0.02
    grasp_z_min_m: 0.15
    grasp_z_max_m: 0.25
    grasp_rotation_deg: 0.0
    # Grasp pre-opening and fixed-placement release use the calibrated
    # full-open pulse.
    grasp_open_gripper_pulse: 900
    gripper_open_pulse: 900
    gripper_close_pulse: 100
    # Every ID1 target in grasp/place reads feedback and approaches its target
    # with no command jump larger than this pulse value.
    gripper_ramp_step_pulse: 100
    grasp_pre_distance: 0.05
    grasp_lift_height: 0.08
    grasp_duration_scale: 2.0
    grasp_include_home: false
    grasp_approach_steps: 8
    grasp_approach_step_duration_ms: 180

    # Fixed placement moves directly to the calibrated reference point, then
    # opens the gripper. ArmPi API axes: +X right, +Y forward, +Z up.
    place_target_configured: true
    place_reference_grasp_arm: [0.0, 0.42, 0.15]
    place_pose_1_duration_ms: 1200
    place_descent_m: 0.02
    place_descent_duration_ms: 800
    place_duration_scale: 1.0
    place_include_home: false

    # Fixed posture services preserve ID1 so the gripper state is unchanged.
    # stand_up targets the current initial position for IDs 2..6; lie_down
    # uses the calibrated compact posture with ID6 pulse 280.
    posture_default_duration_ms: 1200
    posture_servo4_duration_ms: 1500
    posture_servo6_duration_ms: 1000
