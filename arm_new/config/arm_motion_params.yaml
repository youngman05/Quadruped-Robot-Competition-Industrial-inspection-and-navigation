arm_motion_node:
  ros__parameters:
    grasp_actions_topic: /arm/grasp_actions
    place_actions_topic: /arm/place_actions
    status_topic: /arm/status
    # The production node exposes services only.  It never subscribes to YOLO.
    tf_lookup_timeout_s: 1.0
    tf_parent_frame: base_link
    tf_child_frame: arm_base_link
    # Fixed competition motions do not consume this TF. It can still be enabled
    # as an optional diagnostic for a future coordinate-driven preset.
    require_tf_in_preflight: false

    # The selected YAML is a fixed motion preset. Motion remains disabled here
    # and is authorized only by the launch-time arm_motion_authorized override.
    arm_preset: unconfigured
    max_arm_sequence_sec: 20.0
    transform_calibrated: false
    enable_motion: false
    port: /dev/ttyACM0
    baud: 115200
    pause_s: 0.2
    scan_first: true

    # Repository defaults remain fail closed. A competition_v1 override supplies
    # the tested fixed values; no separate approval bundle is required.
    # I1 reference uses arm_base_link axes: +X forward, +Y left, +Z up.
    grasp_reference_configured: false
    # Current hardware-test baseline at z=0.15 m. ArmPi API [0.00, 0.42, z]
    # corresponds to ROS arm_base_link [0.42, 0.00, z].
    grasp_reference_arm_base: [0.42, 0.00]
    grasp_reference_xy_tolerance_m: 0.02
    grasp_z_min_m: 0.15
    grasp_z_max_m: 0.25
    grasp_rotation_deg: 0.0
    # ID1 pulses are calibrated on the current gripper: 400 opens and 256
    # closes. The grasp-open value is separate for future per-phase tuning.
    grasp_open_gripper_pulse: 400
    gripper_open_pulse: 400
    gripper_close_pulse: 256
    grasp_pre_distance: 0.05
    grasp_lift_height: 0.08
    grasp_duration_scale: 2.0
    grasp_include_home: false
    grasp_approach_steps: 8
    grasp_approach_step_duration_ms: 180

    # Fixed placement returns to the grasp-end lift pose, descends while ID3
    # stays fixed, then opens the gripper. ArmPi API axes: +X right, +Y
    # forward, +Z up. Do not enable until the reference is validated on-site.
    place_target_configured: false
    place_reference_grasp_arm: [0.0, 0.0, 0.0]
    place_pose_1_duration_ms: 1200
    place_descent_m: 0.02
    place_descent_duration_ms: 800
    place_duration_scale: 1.0
    place_include_home: false
