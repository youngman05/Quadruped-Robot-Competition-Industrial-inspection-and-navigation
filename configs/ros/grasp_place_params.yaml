# 红条抓取/放置独立测试参数。
# 机器狗需先由人工遥控到 I0，再调用 /task/start_grasp_place。
grasp_place_manager_node:
  ros__parameters:
    # 测试时手工填写巡检得到的两个异常区，例如 ["A", "C"]。
    # 留空会 fail closed，防止误把默认区域当作真实巡检结果。
    manual_abnormal_zones: []
    # 命令行启动可使用 "A,C"，优先级高于上面的 YAML 数组。
    manual_abnormal_zones_csv: ""

    # 所有 I0 / A-D 固定位姿必须来自此唯一标定源，且状态为 calibrated。
    calibration_file: "configs/calibration/competition_sites.yaml"
    required_calibration_status: "calibrated"

    tick_rate: 10.0
    yolo_topic: "/yolo/detections"
    cmd_vel_topic: "/cmd_vel"
    min_yolo_confidence: 0.50
    min_depth_valid_ratio: 0.60
    yolo_stale_timeout_s: 0.50

    # I0 观察与目标锁定：第一趟期待 2 红 + 2 绿；第二趟期待 1 红 + 2 绿。
    observe_timeout_s: 12.0
    observe_window_size: 8
    required_stable_frames: 5
    target_match_gate_m: 0.10
    target_lost_limit: 3
    expected_green_count: 2
    i0_settle_s: 0.8
    confirm_frames: 5

    # I1 参考点位于 arm_base_link；z 每次由最终稳定观测给出。
    grasp_reference_arm: [0.45, 0.0]
    grasp_reference_z_for_selection_m: 0.06
    align_kx: 0.6
    align_ky: 0.6
    align_max_speed_mps: 0.06
    align_min_speed_mps: 0.025
    align_xy_tolerance_m: 0.02
    align_pulse_min_s: 0.15
    align_pulse_max_s: 0.40
    align_settle_s: 0.70
    align_timeout_s: 30.0
    # 首次低速实测后确认方向；若反向，只改对应符号。
    align_x_sign: 1.0
    align_y_sign: 1.0

    # 抓取服务结束即为抬起运输位姿，随后固定放置区再做小范围修正。
    lifted_hold_s: 3.2
    service_wait_timeout_s: 5.0
    service_result_timeout_s: 35.0
    max_nav_retries: 1
    place_nav_settle_s: 1.0
    place_xy_tolerance_m: 0.04
    place_yaw_tolerance_rad: 0.0873
    place_align_kxy: 0.5
    place_align_kyaw: 0.8
    place_align_max_speed_mps: 0.05
    place_align_min_speed_mps: 0.025
    place_align_max_yaw_rps: 0.20
    place_pulse_min_s: 0.15
    place_pulse_max_s: 0.40
    place_settle_s: 0.70
    tf_timeout_s: 0.20
