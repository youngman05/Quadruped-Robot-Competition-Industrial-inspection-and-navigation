# 比赛系统参数 — 集中管理所有 ROS2 节点参数
# 用法: ros2 launch launch/competition.launch.py

gauge_status_publisher_node:
  ros__parameters:
    # --- 相机 ---
    width: 640
    height: 480
    fps: 30
    interval_sec: 0.5            # 检测间隔（秒）
    frame_id: "d455_color_optical_frame"

    # --- 话题 ---
    status_topic: "/gauge/status"
    detected_topic: "/gauge/detected"
    publish_invalid: true         # 是否发布无效帧
    verbose_invalid: false        # 是否打印无效原因

    # --- 调试 ---
    debug_dir: ""                 # 留空不存图；填路径则每帧保存 debug 图

    # --- 校验阈值 ---
    min_color_ratio: 0.04
    min_direction_score: 100
    min_zone_pixels: 300
    max_zone_fraction: 0.62
    min_direction_margin: 2.0

    # --- 稳定性 ---
    stable_frame_count: 3         # 连续 N 帧一致才判定 stable

# --- 以下节点待实现 ---

yolo_detect_publisher_node:
  ros__parameters:
    model_path: "src/cv/yolo_detector/projects/combined/model/best.pt"
    conf: 0.5
    imgsz: 640
    device: "0"              # 0=GPU, cpu=CPU
    interval_sec: 0.1
    frame_id: "d455_color_optical_frame"
    use_d455: true
    camera_id: 0
    width: 640
    height: 480
    enable_depth: true
    detections_topic: "/yolo/detections"
    image_topic: "/yolo/image"
    count_topic: "/yolo/instance_count"

task_manager_node:
  ros__parameters:
    phases: ["start", "pass_obstacle", "inspect_gauges", "report_status", "find_red_bar", "grasp_bar", "place_to_abnormal_zone", "finish"]
    timeout_per_phase: 300.0     # 每阶段超时秒数 (含YOLO, 仪表检测)
    report_duration: 5.0         # 语音播报最短时长
    tick_rate: 10.0              # 状态机主循环频率 (Hz)
    require_stable_gauge: true   # 是否必须仪表稳定检测才推进
    auto_advance: false          # 调试: 自动推进阶段（跳过所有条件）
    phase2_map_yaml: "src/navi/map/competition_field_phase2.yaml"  # Nav2 越障后地图
    gauge_topic: "/gauge/status"
    yolo_topic: "/yolo/detections"
    slam_status_topic: "/visual_slam/status"
    phase_topic: "/task/phase"
    status_topic: "/task/status"

