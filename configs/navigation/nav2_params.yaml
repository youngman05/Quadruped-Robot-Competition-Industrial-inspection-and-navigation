# ==============================================================================
#  Nav2 Parameter Configuration — 2026 Quadruped Robot Competition
#
#  Coordinate frame chain:  map → odom → base_link → camera_link
#  Localization: cuVSLAM (Docker container, no AMCL)
#  Obstacle detection: D455 depth → PointCloud2 → local_costmap
#
#  Global planner options:
#    NavFn (use_astar: true)    — default, built-in A* grid search
#    SmacPlanner2D              — Hybrid-A* with kinematic constraints (commented)
#
#  Controller options:
#    RegulatedPurePursuit        — default, stable for quadruped
#    TEB (teb_local_planner)     — requires source build, commented
# ==============================================================================

# ── Map Server ─────────────────────────────────────────────
map_server:
  ros__parameters:
    yaml_filename: "navi/map/competition_field.yaml"
    frame_id: "map"
    topic_name: "/map"

# ── AMCL (disabled — cuVSLAM provides localization) ───────
amcl:
  ros__parameters:
    use_sim_time: false

# ── BT Navigator ──────────────────────────────────────────
bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: "map"
    robot_base_frame: "base_link"
    odom_topic: "/odom"
    bt_xml_filename: ""
    default_nav_to_pose_bt_xml: ""
    default_nav_through_poses_bt_xml: ""
    plugin_lib_names:
      - "nav2_compute_path_to_pose_action_bt_node"
      - "nav2_compute_path_through_poses_action_bt_node"
      - "nav2_smooth_path_action_bt_node"
      - "nav2_follow_path_action_bt_node"
      - "nav2_spin_action_bt_node"
      - "nav2_wait_action_bt_node"
      - "nav2_assisted_teleop_action_bt_node"
      - "nav2_back_up_action_bt_node"
      - "nav2_drive_on_heading_bt_node"
      - "nav2_clear_costmap_service_bt_node"
      - "nav2_is_stuck_condition_bt_node"
      - "nav2_transform_available_condition_bt_node"
      - "nav2_goal_reached_condition_bt_node"
      - "nav2_goal_updated_condition_bt_node"
      - "nav2_globally_updated_goal_condition_bt_node"
      - "nav2_is_path_valid_condition_bt_node"
      - "nav2_initial_pose_received_condition_bt_node"
      - "nav2_reinitialize_global_localization_service_bt_node"
      - "nav2_rate_controller_bt_node"
      - "nav2_distance_controller_bt_node"
      - "nav2_speed_controller_bt_node"
      - "nav2_truncate_path_action_bt_node"
      - "nav2_truncate_path_local_action_bt_node"
      - "nav2_goal_updater_node_bt_node"
      - "nav2_recovery_node_bt_node"
      - "nav2_pipeline_sequence_bt_node"
      - "nav2_round_robin_node_bt_node"
      - "nav2_transform_available_condition_bt_node"
      - "nav2_time_expired_condition_bt_node"
      - "nav2_path_expiring_timer_condition"
      - "nav2_distance_traveled_condition_bt_node"
      - "nav2_single_trigger_bt_node"
      - "nav2_goal_updated_controller_bt_node"
      - "nav2_is_battery_low_condition_bt_node"
      - "nav2_navigate_through_poses_action_bt_node"
      - "nav2_navigate_to_pose_action_bt_node"
      - "nav2_remove_passed_goals_action_bt_node"
      - "nav2_planner_selector_bt_node"
      - "nav2_controller_selector_bt_node"
      - "nav2_goal_checker_selector_bt_node"
      - "nav2_controller_cancel_bt_node"
      - "nav2_path_longer_on_approach_bt_node"
      - "nav2_wait_cancel_bt_node"
      - "nav2_spin_cancel_bt_node"
      - "nav2_back_up_cancel_bt_node"
      - "nav2_assisted_teleop_cancel_bt_node"
      - "nav2_drive_on_heading_cancel_bt_node"
      - "nav2_is_stuck_condition_bt_node"

# ── Planner Server ────────────────────────────────────────
planner_server:
  ros__parameters:
    expected_planner_frequency: 1.0
    use_sim_time: false
    planner_plugins: ["GridBased"]

    # ---- OPTION A: NavFn (default, use_astar=true for A*) ----
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.5
      use_astar: true         # A* heuristic search (set false for Dijkstra)
      allow_unknown: false

    # A* is sufficient — robot can turn in place (zero turning radius).
    # No need for Dubins/Reeds-Shepp kinematic models.

# ── Controller Server ─────────────────────────────────────
controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    # Checker plugins
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.1
      movement_time_allowance: 10.0

    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.15       # 15 cm tolerance (quadruped step accuracy)
      yaw_goal_tolerance: 0.25      # ~14 deg tolerance
      stateful: true

    # ---- OPTION A: Regulated Pure Pursuit (default) ----
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.25        # 0.25 m/s walking speed
      lookahead_dist: 0.5             # look ahead 0.5m
      min_lookahead_dist: 0.3
      max_lookahead_dist: 0.9
      lookahead_time: 1.5
      use_velocity_scaled_lookahead_dist: true
      min_approach_linear_velocity: 0.05
      approach_velocity_scaling_dist: 0.6
      max_allowed_time_to_collision_up_to_carrot: 1.0
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: false
      regulated_linear_scaling_min_radius: 0.5
      regulated_linear_scaling_min_speed: 0.1
      use_fixed_curvature_lookahead: false
      curvature_lookahead_dist: 0.5
      use_rotate_to_heading: true
      rotate_to_heading_min_angle: 0.785
      max_angular_accel: 1.5
      max_robot_pose_search_dist: 10.0
      use_interpolation: true
      transform_tolerance: 0.3
      use_collision_detection: true
      max_linear_vel: 0.3
      max_angular_vel: 0.5

    # ---- OPTION B: TEB Local Planner ----
    # To switch: change controller_plugins above and build teb_local_planner first.
    #
    # FollowPath:
    #   plugin: "teb_local_planner::TebLocalPlannerROS"
    #   max_vel_x: 0.3
    #   max_vel_x_backwards: 0.1
    #   max_vel_theta: 0.5
    #   acc_lim_x: 0.5
    #   acc_lim_theta: 1.0
    #   min_turning_radius: 0.0
    #   footprint_model:
    #     type: "circular"
    #     radius: 0.25
    #   min_obstacle_dist: 0.15
    #   inflation_dist: 0.3
    #   include_costmap_obstacles: true
    #   costmap_obstacles_behind_robot_dist: 1.0
    #   obstacle_poses_affected: 15
    #   weight_kinematics_nh: 1000.0
    #   xy_goal_tolerance: 0.15
    #   yaw_goal_tolerance: 0.25
    #   free_goal_vel: false
    #   complete_global_plan: true
    #   # Trajectory optimization
    #   dt_ref: 0.3
    #   dt_hysteresis: 0.1
    #   global_plan_overwrite_orientation: true
    #   allow_init_with_backwards_motion: false
    #   max_global_plan_lookahead_dist: 3.0
    #   force_reinit_new_goal_dist: 1.0
    #   feasibility_check_no_poses: 5
    #   publish_feedback: false
    #   shrink_horizon_backup: true
    #   allow_obstacle_spot: true

# ── Behavior Server ───────────────────────────────────────
behavior_server:
  ros__parameters:
    use_sim_time: false
    local_costmap_topic: "/local_costmap/costmap_raw"
    global_costmap_topic: "/global_costmap/costmap_raw"
    footprint_topic: "/local_costmap/published_footprint"
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    assisted_teleop:
      plugin: "nav2_behaviors/AssistedTeleop"
    global_frame: "map"
    robot_base_frame: "base_link"
    transform_tolerance: 0.3
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.5
    min_rotational_vel: 0.2
    rotational_acc_lim: 1.5

# ── Global Costmap ───────────────────────────────────────
global_costmap:
  ros__parameters:
    update_frequency: 1.0
    publish_frequency: 1.0
    global_frame: "map"
    robot_base_frame: "base_link"
    # 机器人视为 1.0m × 0.5m 长方形 (x=长, y=宽)
    footprint: [[0.5, 0.25], [0.5, -0.25], [-0.5, -0.25], [-0.5, 0.25]]
    use_sim_time: false
    resolution: 0.025
    track_unknown_space: true
    always_send_full_costmap: true
    footprint_padding: 0.02
    transform_tolerance: 0.3

    plugins: ["static_layer", "obstacle_layer", "inflation_layer"]

    static_layer:
      plugin: "nav2_costmap_2d::StaticLayer"
      map_subscribe_transient_local: true
      enabled: true

    obstacle_layer:
      plugin: "nav2_costmap_2d::VoxelLayer"
      enabled: true
      footprint_clearing_enabled: true
      max_obstacle_height: 2.0
      origin_z: 0.0
      z_resolution: 0.2
      z_voxels: 10
      publish_voxel_map: false
      observation_sources: "d455_pointcloud"
      d455_pointcloud:
        topic: "/camera/depth/points"
        max_obstacle_height: 2.0
        min_obstacle_height: 0.05        # ignore floor reflections
        obstacle_max_range: 4.0          # D455 max reliable depth ~4m
        obstacle_min_range: 0.2
        raytrace_max_range: 5.0
        raytrace_min_range: 0.2
        clearing: true
        marking: true
        data_type: "PointCloud2"
        min_points: 3

    inflation_layer:
      plugin: "nav2_costmap_2d::InflationLayer"
      inflation_radius: 0.2
      cost_scaling_factor: 3.0

# ── Local Costmap ────────────────────────────────────────
local_costmap:
  ros__parameters:
    update_frequency: 10.0
    publish_frequency: 10.0
    global_frame: "odom"
    robot_base_frame: "base_link"
    footprint: [[0.5, 0.25], [0.5, -0.25], [-0.5, -0.25], [-0.5, 0.25]]
    use_sim_time: false
    resolution: 0.025
    width: 120                  # 120 × 0.025 = 3.0 m
    height: 120                 # 3.0 m window for 1m-long robot
    rolling_window: true
    always_send_full_costmap: false
    footprint_padding: 0.01
    transform_tolerance: 0.3

    plugins: ["voxel_layer", "inflation_layer"]

    voxel_layer:
      plugin: "nav2_costmap_2d::VoxelLayer"
      enabled: true
      footprint_clearing_enabled: true
      max_obstacle_height: 2.0
      z_resolution: 0.2
      z_voxels: 10
      observation_sources: "d455_pointcloud"
      d455_pointcloud:
        topic: "/camera/depth/points"
        max_obstacle_height: 2.0
        min_obstacle_height: 0.05
        obstacle_max_range: 4.0
        obstacle_min_range: 0.2
        raytrace_max_range: 5.0
        raytrace_min_range: 0.2
        clearing: true
        marking: true
        data_type: "PointCloud2"
        min_points: 2

    inflation_layer:
      plugin: "nav2_costmap_2d::InflationLayer"
      inflation_radius: 0.3
      cost_scaling_factor: 5.0

# ── Waypoint Follower ─────────────────────────────────────
waypoint_follower:
  ros__parameters:
    use_sim_time: false
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: true
      waypoint_pause_duration: 200

# ── Velocity Smoother ─────────────────────────────────────
velocity_smoother:
  ros__parameters:
    use_sim_time: false
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: "OPEN_LOOP"
    max_velocity: [0.3, 0.0, 0.5]
    min_velocity: [-0.1, 0.0, -0.5]
    max_accel: [0.5, 0.0, 1.5]
    max_decel: [-0.8, 0.0, -2.0]
    odom_topic: "/odom"
    odom_duration: 0.1

# ── Lifecycle Manager ─────────────────────────────────────
lifecycle_manager:
  ros__parameters:
    use_sim_time: false
    autostart: true
    node_names:
      - "map_server"
      - "planner_server"
      - "controller_server"
      - "bt_navigator"
      - "behavior_server"
      - "waypoint_follower"
      - "velocity_smoother"
    bond_timeout: 4.0
    attempt_respawn_reconnection: true
    bond_respawn_max_duration: 10.0
