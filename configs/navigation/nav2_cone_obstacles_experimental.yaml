# Opt-in L4 experiment overlay. This file is never selected by default.
# It keeps the accepted cone scan layer contract while testing wider inflation
# and lower path-attraction / higher obstacle-cost critic weights.

controller_server:
  ros__parameters:
    controller_plugins: ["FollowPath", "FollowPathCone"]
    FollowPathCone:
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: true
      min_vel_x: 0.0
      min_vel_y: 0.0
      max_vel_x: 0.24
      max_vel_y: 0.0
      max_vel_theta: 0.30
      min_speed_xy: 0.0
      max_speed_xy: 0.24
      min_speed_theta: 0.0
      acc_lim_x: 0.35
      acc_lim_y: 0.0
      acc_lim_theta: 0.8
      decel_lim_x: -0.45
      decel_lim_y: 0.0
      decel_lim_theta: -1.0
      vx_samples: 16
      vy_samples: 1
      vtheta_samples: 21
      sim_time: 3.0
      linear_granularity: 0.05
      angular_granularity: 0.025
      transform_tolerance: 0.3
      xy_goal_tolerance: 0.30
      trans_stopped_velocity: 0.03
      short_circuit_trajectory_evaluation: true
      stateful: true
      critics:
        - "RotateToGoal"
        - "Oscillation"
        - "ObstacleFootprint"
        - "GoalAlign"
        - "PathAlign"
        - "PathDist"
        - "GoalDist"
      ObstacleFootprint.scale: 1.0
      PathAlign.scale: 12.0
      PathAlign.forward_point_distance: 0.30
      GoalAlign.scale: 24.0
      GoalAlign.forward_point_distance: 0.30
      PathDist.scale: 12.0
      GoalDist.scale: 24.0
      RotateToGoal.scale: 32.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0

local_costmap:
  local_costmap:
    ros__parameters:
      plugins: ["static_layer", "cone_obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      cone_obstacle_layer:
        plugin: "cone_inflated_voxel_layer/ConeInflatedVoxelLayer"
        enabled: true
        inflation_radius: 0.75
        cost_scaling_factor: 1.5
        publish_voxel_map: false
        origin_z: 0.0
        z_resolution: 0.08
        z_voxels: 16
        unknown_threshold: 15
        mark_threshold: 0
        combination_method: 1
        max_obstacle_height: 1.20
        observation_sources: "cone_scan"
        cone_scan:
          topic: "/cone_obstacle/scan"
          data_type: "LaserScan"
          marking: true
          clearing: false
          min_obstacle_height: 0.0
          max_obstacle_height: 1.20
          obstacle_range: 3.00
          raytrace_range: 3.00
          observation_persistence: 1.5
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"

global_costmap:
  global_costmap:
    ros__parameters:
      plugins: ["static_layer", "cone_obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      cone_obstacle_layer:
        plugin: "cone_inflated_voxel_layer/ConeInflatedVoxelLayer"
        enabled: true
        inflation_radius: 0.75
        cost_scaling_factor: 1.5
        publish_voxel_map: false
        origin_z: 0.0
        z_resolution: 0.08
        z_voxels: 16
        unknown_threshold: 15
        mark_threshold: 0
        combination_method: 1
        max_obstacle_height: 1.20
        observation_sources: "cone_scan"
        cone_scan:
          topic: "/cone_obstacle/scan"
          data_type: "LaserScan"
          marking: true
          clearing: false
          min_obstacle_height: 0.0
          max_obstacle_height: 1.20
          obstacle_range: 3.00
          raytrace_range: 3.00
          observation_persistence: 1.5
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
