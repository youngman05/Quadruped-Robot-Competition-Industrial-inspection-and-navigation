# Opt-in L4 experiment overlay. This file is never selected by default.
# It keeps the accepted cone scan layer contract while testing wider inflation
# and lower path-attraction / higher obstacle-cost critic weights.

controller_server:
  ros__parameters:
    FollowPath:
      debug_trajectory_details: true
      vtheta_samples: 21
      ObstacleFootprint.scale: 1.0
      PathAlign.scale: 16.0
      PathDist.scale: 16.0

local_costmap:
  local_costmap:
    ros__parameters:
      plugins: ["static_layer", "cone_obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      cone_obstacle_layer:
        plugin: "nav2_costmap_2d/NonPersistentVoxelLayer"
        enabled: true
        publish_voxel_map: false
        origin_z: 0.0
        z_resolution: 0.08
        z_voxels: 16
        unknown_threshold: 15
        mark_threshold: 0
        combination_method: 1
        max_obstacle_height: 1.20
        observation_sources: "cone_scan"
        cone_scan:
          topic: "/cone_obstacle/scan"
          data_type: "LaserScan"
          marking: true
          clearing: false
          min_obstacle_height: 0.0
          max_obstacle_height: 1.20
          obstacle_range: 2.50
          raytrace_range: 3.00
          observation_persistence: 1.5
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 2.0
        inflation_radius: 0.45

global_costmap:
  global_costmap:
    ros__parameters:
      plugins: ["static_layer", "cone_obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      cone_obstacle_layer:
        plugin: "nav2_costmap_2d/NonPersistentVoxelLayer"
        enabled: true
        publish_voxel_map: false
        origin_z: 0.0
        z_resolution: 0.08
        z_voxels: 16
        unknown_threshold: 15
        mark_threshold: 0
        combination_method: 1
        max_obstacle_height: 1.20
        observation_sources: "cone_scan"
        cone_scan:
          topic: "/cone_obstacle/scan"
          data_type: "LaserScan"
          marking: true
          clearing: false
          min_obstacle_height: 0.0
          max_obstacle_height: 1.20
          obstacle_range: 2.50
          raytrace_range: 3.00
          observation_persistence: 1.5
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 2.0
        inflation_radius: 0.45
