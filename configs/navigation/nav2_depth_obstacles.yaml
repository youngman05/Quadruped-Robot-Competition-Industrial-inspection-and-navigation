# Optional overlay loaded after nav2_params.yaml only when the staged D455
# pipeline is enabled. The validated static-only profile remains unchanged.

local_costmap:
  local_costmap:
    ros__parameters:
      plugins: ["static_layer", "voxel_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: true
        publish_voxel_map: false
        origin_z: 0.0
        z_resolution: 0.08
        z_voxels: 16
        max_obstacle_height: 1.20
        mark_threshold: 0
        observation_sources: "depth_points"
        depth_points:
          topic: "/camera/depth/points"
          data_type: "PointCloud2"
          sensor_frame: "camera_depth_optical_frame"
          marking: true
          clearing: true
          min_obstacle_height: 0.05
          max_obstacle_height: 1.20
          obstacle_min_range: 0.20
          obstacle_max_range: 2.50
          raytrace_min_range: 0.20
          raytrace_max_range: 3.00
          observation_persistence: 0.0
          expected_update_rate: 0.10
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.30

global_costmap:
  global_costmap:
    ros__parameters:
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: "depth_points"
        depth_points:
          topic: "/camera/depth/points"
          data_type: "PointCloud2"
          sensor_frame: "camera_depth_optical_frame"
          marking: true
          clearing: true
          min_obstacle_height: 0.05
          max_obstacle_height: 1.20
          obstacle_min_range: 0.20
          obstacle_max_range: 2.50
          raytrace_min_range: 0.20
          raytrace_max_range: 3.00
          observation_persistence: 0.0
          expected_update_rate: 0.10
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.30
