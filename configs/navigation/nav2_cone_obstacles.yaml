# Opt-in Foxy obstacle overlay for the Humble D455 LaserScan UDP bridge.
# Both costmaps consume the same buffered cone observations so NavFn can plan
# around cones before DWB reaches a forward-only local minimum.
#
# Phase 106 early-avoidance tuning: cones are marked out to the 3.0 m scan
# ceiling, inflation covers the 0.43 m footprint corner radius so NavFn bends
# away early, DWB looks 2.5 s ahead, and path attraction is halved so the
# controller may leave the straight line before it is blocked.

controller_server:
  ros__parameters:
    FollowPath:
      vtheta_samples: 21
      ObstacleFootprint.scale: 1.0
      sim_time: 2.5
      PathAlign.scale: 16.0
      PathDist.scale: 16.0

local_costmap:
  local_costmap:
    ros__parameters:
      plugins: ["static_layer", "cone_obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      cone_obstacle_layer:
        plugin: "nav2_costmap_2d/NonPersistentVoxelLayer"
        enabled: true
        publish_voxel_map: false
        origin_z: 0.0
        z_resolution: 0.08
        z_voxels: 16
        unknown_threshold: 15
        mark_threshold: 0
        combination_method: 1
        max_obstacle_height: 1.20
        observation_sources: "cone_scan"
        cone_scan:
          topic: "/cone_obstacle/scan"
          data_type: "LaserScan"
          marking: true
          clearing: false
          min_obstacle_height: 0.0
          max_obstacle_height: 1.20
          obstacle_range: 3.00
          raytrace_range: 3.00
          observation_persistence: 1.5
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 2.0
        inflation_radius: 0.60

global_costmap:
  global_costmap:
    ros__parameters:
      plugins: ["static_layer", "cone_obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      cone_obstacle_layer:
        plugin: "nav2_costmap_2d/NonPersistentVoxelLayer"
        enabled: true
        publish_voxel_map: false
        origin_z: 0.0
        z_resolution: 0.08
        z_voxels: 16
        unknown_threshold: 15
        mark_threshold: 0
        combination_method: 1
        max_obstacle_height: 1.20
        observation_sources: "cone_scan"
        cone_scan:
          topic: "/cone_obstacle/scan"
          data_type: "LaserScan"
          marking: true
          clearing: false
          min_obstacle_height: 0.0
          max_obstacle_height: 1.20
          obstacle_range: 3.00
          raytrace_range: 3.00
          observation_persistence: 1.5
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 2.0
        inflation_radius: 0.60
