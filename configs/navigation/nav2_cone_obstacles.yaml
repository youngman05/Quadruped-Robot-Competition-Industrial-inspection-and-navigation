# Opt-in Foxy local obstacle overlay for the Humble D455 LaserScan UDP bridge.
# The global costmap is intentionally absent and remains static-only.

local_costmap:
  local_costmap:
    ros__parameters:
      plugins: ["static_layer", "cone_obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      cone_obstacle_layer:
        plugin: "nav2_costmap_2d/NonPersistentVoxelLayer"
        enabled: true
        publish_voxel_map: false
        origin_z: 0.0
        z_resolution: 0.08
        z_voxels: 16
        unknown_threshold: 15
        mark_threshold: 0
        combination_method: 1
        max_obstacle_height: 1.20
        observation_sources: "cone_scan"
        cone_scan:
          topic: "/cone_obstacle/scan"
          data_type: "LaserScan"
          marking: true
          clearing: false
          min_obstacle_height: 0.0
          max_obstacle_height: 1.20
          obstacle_range: 2.50
          raytrace_range: 3.00
          observation_persistence: 1.5
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.30
