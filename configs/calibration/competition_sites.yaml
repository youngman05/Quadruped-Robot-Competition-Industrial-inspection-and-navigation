schema_version: 1

# System-level spatial calibration shared by task_manager and arm_motion_node.
# Runtime consumers must reject required entries whose status is not
# "calibrated". All dog poses use the ROS map frame directly; do not enter
# field-diagram millimetres here.
calibration_set:
  id: competition-sites-2026-08-09-draft
  map_id: competition_field_phase2
  calibrated_at: null
  calibrated_by: null

convention:
  dog_pose_frame: map
  dog_pose_format: [x_m, y_m, yaw_rad]
  length_unit: m
  angle_unit: rad
  axes: "ROS REP-103: X forward, Y left, Z up"

# Provisional values below preserve the current design-document candidates.
# Navigation/SLAM integration must replace or confirm them from map->base_link.
dog_poses:
  start:
    pose_map_m_rad: [5.35, 0.75, 3.141593]
    status: provisional
    purpose: competition start pose

  obstacle_cross_target:
    pose_map_m_rad: [0.50, 0.75, null]
    status: uncalibrated
    purpose: safe corridor after obstacle traversal

  inspection_pos1_middle:
    pose_map_m_rad: [1.50, 3.25, -1.570796]
    status: provisional
    purpose: inspect upper cabinet bottom face

  inspection_pos1_middle_turned:
    pose_map_m_rad: [1.50, 3.25, 1.570796]
    status: provisional
    purpose: inspect lower cabinet top face

  inspection_pos2a_upper_right:
    pose_map_m_rad: [2.20, 4.50, 3.141593]
    status: provisional
    purpose: inspect upper cabinet right face

  inspection_pos2b_lower_right:
    pose_map_m_rad: [2.20, 2.00, 3.141593]
    status: provisional
    purpose: inspect lower cabinet right face

  grasp_i0:
    pose_map_m_rad: null
    status: conflict
    purpose: coarse grasp alignment before visual I1 alignment
    note: "navigation_client.py and src/navi/README.md currently disagree; remeasure x/y/yaw"

  placement_A:
    pose_map_m_rad: [3.25, 5.40, 0.0]
    status: provisional
    purpose: fixed dog pose for placing into zone A

  placement_B:
    pose_map_m_rad: [3.75, 5.40, 0.0]
    status: provisional
    purpose: fixed dog pose for placing into zone B

  placement_C:
    pose_map_m_rad: [4.25, 5.40, 0.0]
    status: provisional
    purpose: fixed dog pose for placing into zone C

  placement_D:
    pose_map_m_rad: [4.75, 5.40, 0.0]
    status: provisional
    purpose: fixed dog pose for placing into zone D

manipulation:
  # I1 is a dynamic alignment condition, not a second map waypoint.
  grasp_i1:
    target_frame: arm_base_link
    # Verified on the mounted arm with the standalone face-approach grasp:
    # ArmPi API target [0.00, 0.45, z] maps to arm_base_link [0.45, 0.00, z].
    fixed_xy_m: [0.45, 0.00]
    z_mode: dynamic_service_request
    z_valid_range_m: [0.02, 0.12]
    status: confirmed_reference

  # First implementation uses one arm-relative release target for A/B/C/D;
  # the four map poses must be calibrated around this common motion.
  fixed_release:
    target_frame: arm_api
    target_m: null
    status: uncalibrated

smoke_test:
  grasp_z_m: 0.06
