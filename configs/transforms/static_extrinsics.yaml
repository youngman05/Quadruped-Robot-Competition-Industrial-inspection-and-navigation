schema_version: 1

# Every transform maps a point from child_frame into parent_frame:
# p_parent = R_parent_child * p_child + t_parent_child
convention:
  length_unit: m
  quaternion_order: xyzw
  axes: "ROS REP-103: X forward, Y left, Z up"

frames:
  base_link:
    owner: robot_description
    description: "Lite3 torso/body reference frame."
  camera_link:
    owner: project_static_extrinsics
    description: "D455 mechanical frame; RealSense owns the child optical frames."
  arm_base_link:
    owner: project_static_extrinsics
    description: "Arm mounting frame. Its static extrinsic is not measured yet."

static_transforms:
  - parent_frame: base_link
    child_frame: camera_link
    translation_m: [0.231724440, 0.077561412, 0.503275873]
    rotation_xyzw: [0.000900958, 0.240529563, -0.013474058, 0.970547870]
    publish: true
    status: calibrated
    source: "Five-point stationary green-block fit on Jetson Xavier; raw D455 camera_link UDP observations to surveyed base_link face centers."
    measurement:
      calibrated_at: "2026-08-04"
      translational_uncertainty_m: [0.020, 0.020, 0.020]
      rotational_uncertainty_deg: [1.5, 1.5, 1.5]
